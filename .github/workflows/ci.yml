name: Native macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test synthetic accounting and forecast fixtures
        run: swift test --build-system native
      - name: Test recursive cohort coverage
        run: python3 -m unittest discover -s Tests/MeasurementTests -p 'test_*.py'
      - name: Test build identity fixtures
        run: python3 -m unittest discover -s Tests/BuildTests -p 'test_*.py'
      - name: Lint Swift
        run: xcrun swift-format lint --strict --recursive Sources Tests Package.swift
      - name: Build native application
        run: bash scripts/build-app.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/Aerie.app/Contents/Info.plist
          codesign --verify --strict dist/Aerie.app
          python3 scripts/check-app-build.py dist/Aerie.app
